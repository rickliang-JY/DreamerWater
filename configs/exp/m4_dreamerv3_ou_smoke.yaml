# M4 冒烟配置：OU 时变洋流 × tiny DreamerV3，CPU 上 10 分钟内跑完
# （沿用 m2 冒烟的 tiny 参数，唯一差异是 vehicle 换成 OU 与 logdir/exp_id）
# 用途：验证 OU 全管线（适配器 current_gt 暗通道落盘 + P2 探针），
# 不断言学习效果。产物输出到 runs/（gitignore，不入库）。
exp_id: m4_dreamerv3_ou_smoke
seeds: [0]
vehicle: configs/vehicle/bluerov2_ou.yaml
task: {}
dv3_overrides:
  task: uwm_station_keeping
  logdir: runs/m4_dreamerv3_ou_smoke/seed0/dv3_logdir
  steps: 600
  eval_every: 500
  log_every: 500
  eval_episode_num: 1
  prefill: 100
  envs: 1
  action_repeat: 1
  time_limit: 100           # 冒烟专用：缩短 episode（10s 物理时长）提速
  size: [16, 16]            # image 仅为占位哑数据
  device: cpu
  compile: false
  precision: 32
  train_ratio: 32
  batch_size: 4
  batch_length: 8
  dyn_hidden: 32
  dyn_deter: 32
  dyn_stoch: 16
  dyn_discrete: 16
  units: 32
  imag_horizon: 15
  encoder: {mlp_keys: 'state', cnn_keys: '$^', mlp_layers: 2, mlp_units: 64}
  decoder: {mlp_keys: 'state', cnn_keys: '$^', mlp_layers: 2, mlp_units: 64}
  video_pred_log: false
  reward_EMA: true
seed: 0
